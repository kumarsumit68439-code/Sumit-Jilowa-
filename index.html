<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firebase Auth - Sumit Jilowa</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow"></div>
    <div class="container">
      <div id="authView">
        <h1 class="title neon-text">Firebase Auth</h1>
        <p class="owner-name">Website Owner: Sumit Jilowa</p>

        <div class="card neon-card">
          <h3 class="section-title">Email Login</h3>
          <input id="email" type="email" placeholder="Email" />
          <input id="password" type="password" placeholder="Password" />
          <button onclick="signUp()">Sign Up</button>
          <button onclick="login()">Login</button>

          <hr style="border-color: rgba(0,247,255,0.2); margin: 18px 0;" />

          <h3 class="section-title">Google Login</h3>
          <button onclick="loginWithGoogle()">Login with Google</button>

          <hr style="border-color: rgba(0,247,255,0.2); margin: 18px 0;" />

          <h3 class="section-title">Phone OTP Login</h3>
          <input id="phone" type="tel" placeholder="+91XXXXXXXXXX" />
          <button onclick="sendOTP()">Send OTP</button>

          <div id="otpSection" style="display:none; margin-top: 12px;">
            <input id="otp" type="text" placeholder="Enter 6-digit OTP" />
            <button onclick="verifyOTP()">Verify OTP</button>
          </div>

          <!-- reCAPTCHA container (required for Phone Auth) -->
          <div id="recaptcha-container"></div>
        </div>
      </div>

      <div id="homeView" style="display:none;">
        <h1 class="title neon-text">Local Password Vault</h1>
        <p class="owner-name">Website Owner: Sumit Jilowa</p>

        <div class="card neon-card">
          <input id="siteName" type="text" placeholder="Website / App name" />
          <input id="siteUser" type="text" placeholder="Username / Email" />
          <input id="sitePass" type="password" placeholder="Password" />
          <button onclick="saveEntry()">Save</button>
          <button onclick="logout()">Logout</button>
        </div>

        <div class="card neon-card">
          <h2 class="section-title">Saved Entries</h2>
          <div id="entries"></div>
        </div>
      </div>

      <div class="card neon-card">
        <h2 class="section-title">Status</h2>
        <div id="status">Not logged in</div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signInWithPopup,
        GoogleAuthProvider,
        signInWithPhoneNumber,
        RecaptchaVerifier,
        signOut,
        onAuthStateChanged
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCc2EE3QS27fF9Jhd-h-yqAeMhGsZgWmwk",
        authDomain: "umit-jilowa.firebaseapp.com",
        databaseURL: "https://umit-jilowa-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "umit-jilowa",
        storageBucket: "umit-jilowa.firebasestorage.app",
        messagingSenderId: "76391524954",
        appId: "1:76391524954:web:c615ce7241cdacbe6e8663",
        measurementId: "G-J9SEBYLSZR"
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);
      const googleProvider = new GoogleAuthProvider();

      const statusEl = document.getElementById("status");
      const authView = document.getElementById("authView");
      const homeView = document.getElementById("homeView");
      const entriesEl = document.getElementById("entries");
      const otpSection = document.getElementById("otpSection");

      let confirmationResult = null;

      // ---------- Local Vault Functions ----------
      function getEntries() {
        return JSON.parse(localStorage.getItem("vaultEntries") || "[]");
      }

      function saveEntries(entries) {
        localStorage.setItem("vaultEntries", JSON.stringify(entries));
      }

      function renderEntries() {
        const entries = getEntries();
        if (entries.length === 0) {
          entriesEl.innerHTML = "<p>No saved entries yet.</p>";
          return;
        }

        entriesEl.innerHTML = entries
          .map(
            (entry, index) => `
              <div class="entry">
                <strong>${entry.siteName}</strong>
                <div>Username: ${entry.siteUser}</div>
                <div>Password: ${entry.sitePass}</div>
                <button class="small-btn" onclick="deleteEntry(${index})">Delete</button>
              </div>
            `
          )
          .join("");
      }

      window.saveEntry = function () {
        const siteName = document.getElementById("siteName").value.trim();
        const siteUser = document.getElementById("siteUser").value.trim();
        const sitePass = document.getElementById("sitePass").value.trim();

        if (!siteName || !siteUser || !sitePass) {
          alert("Please fill all fields.");
          return;
        }

        const entries = getEntries();
        entries.push({ siteName, siteUser, sitePass });
        saveEntries(entries);

        document.getElementById("siteName").value = "";
        document.getElementById("siteUser").value = "";
        document.getElementById("sitePass").value = "";

        renderEntries();
      };

      window.deleteEntry = function (index) {
        const entries = getEntries();
        entries.splice(index, 1);
        saveEntries(entries);
        renderEntries();
      };

      // ---------- Email Auth ----------
      window.signUp = async function () {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        try {
          await createUserWithEmailAndPassword(auth, email, password);
          statusEl.textContent = "Account created successfully";
        } catch (err) {
          statusEl.textContent = "Sign up failed: " + err.message;
        }
      };

      window.login = async function () {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        try {
          await signInWithEmailAndPassword(auth, email, password);
          statusEl.textContent = "Logged in with Email";
        } catch (err) {
          statusEl.textContent = "Login failed: " + err.message;
        }
      };

      // ---------- Google Login ----------
      window.loginWithGoogle = async function () {
        try {
          await signInWithPopup(auth, googleProvider);
          statusEl.textContent = "Logged in with Google";
        } catch (err) {
          statusEl.textContent = "Google login failed: " + err.message;
        }
      };

      // ---------- Phone OTP ----------
      function setupRecaptcha() {
        if (!window.recaptchaVerifier) {
          window.recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
            size: "invisible",
            callback: () => {},
            "expired-callback": () => {
              window.recaptchaVerifier = null;
            }
          });
        }
      }

      window.sendOTP = async function () {
        const phone = document.getElementById("phone").value.trim();

        if (!phone.startsWith("+")) {
          alert("Phone number + ke saath daalo (example: +919876543210)");
          return;
        }

        try {
          setupRecaptcha();
          confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
          otpSection.style.display = "block";
          statusEl.textContent = "OTP sent successfully";
        } catch (err) {
          statusEl.textContent = "OTP send failed: " + err.message;
          // Reset reCAPTCHA on error
          if (window.recaptchaVerifier) {
            window.recaptchaVerifier.clear();
            window.recaptchaVerifier = null;
          }
        }
      };

      window.verifyOTP = async function () {
        const otp = document.getElementById("otp").value.trim();

        if (!confirmationResult) {
          alert("Pehle OTP bhejo");
          return;
        }

        try {
          await confirmationResult.confirm(otp);
          statusEl.textContent = "Logged in with Phone";
        } catch (err) {
          statusEl.textContent = "OTP verification failed: " + err.message;
        }
      };

      // ---------- Logout ----------
      window.logout = async function () {
        await signOut(auth);
      };

      // ---------- Auth State Listener ----------
      onAuthStateChanged(auth, (user) => {
        if (user) {
          authView.style.display = "none";
          homeView.style.display = "block";
          const displayName = user.email || user.phoneNumber || user.displayName || user.uid;
          statusEl.textContent = "Logged in: " + displayName;
          renderEntries();
        } else {
          authView.style.display = "block";
          homeView.style.display = "none";
          statusEl.textContent = "Not logged in";
          otpSection.style.display = "none";
          confirmationResult = null;
        }
      });

      renderEntries();
    </script>
  </body>
</html>
